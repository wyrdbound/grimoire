name: Release

# This workflow is the single publish path. It runs:
#   - on a human-published Release;
#   - via workflow_dispatch, naming a tag: by hand, or dispatched by
#     release-please.yml after it creates a release.
#
# A release-please release is created with GITHUB_TOKEN, which emits no
# `release: published` event other workflows can see, so release-please.yml
# dispatches this workflow instead. It must run as a top-level workflow, not
# a reusable one: PyPI's trusted publisher is registered for release.yml, and
# a reusable workflow's attestation names its caller. No PAT is needed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. grimoire-spec-v1.0.0)"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # `inputs.tag` is set by workflow_dispatch; a release
      # event falls back to the tag it was published for.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
