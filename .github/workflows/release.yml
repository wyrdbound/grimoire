name: Release

# This workflow is the single publish path. It runs:
#   - on a published Release (a human-created one, or a workflow_call below);
#   - manually via workflow_dispatch, naming a tag;
#   - when release-please.yml calls it after creating a release.
#
# A release-please release is created with GITHUB_TOKEN, which emits no
# `release: published` event other workflows can see, so it is reached through
# workflow_call from release-please.yml (which runs on a normal push to main)
# rather than through the `release` trigger. No PAT is needed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. grimoire-spec-v1.0.0)"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # `inputs.tag` is set by workflow_call and workflow_dispatch; a release
      # event falls back to the tag it was published for.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
