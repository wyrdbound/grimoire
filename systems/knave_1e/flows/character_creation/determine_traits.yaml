id: determine_traits
kind: flow
name: "Determine Character Traits"
description: "Determine the physical and personality traits for character creation process for {{ system.name }}"
version: 1

outputs:
  - id: traits
    type: character_traits

steps:
  - id: generate_traits
    name: "Determine Character Traits"
    type: table_roll
    prompt: "Rolling for your character's physical and personality traits..."
    parallel: true
    tables:
      - table: physique
        actions:
          - set_value:
              path: "outputs.traits.physique"
              value: "{{ result.entry }}"
      - table: face
        actions:
          - set_value:
              path: "outputs.traits.face"
              value: "{{ result.entry }}"
      - table: skin
        actions:
          - set_value:
              path: "outputs.traits.skin"
              value: "{{ result.entry }}"
      - table: hair
        actions:
          - set_value:
              path: "outputs.traits.hair"
              value: "{{ result.entry }}"
      - table: clothing
        actions:
          - set_value:
              path: "outputs.traits.clothing"
              value: "{{ result.entry }}"
      - table: virtue
        actions:
          - set_value:
              path: "outputs.traits.virtue"
              value: "{{ result.entry }}"
      - table: vice
        actions:
          - set_value:
              path: "outputs.traits.vice"
              value: "{{ result.entry }}"
      - table: speech
        actions:
          - set_value:
              path: "outputs.traits.speech"
              value: "{{ result.entry }}"
      - table: background
        actions:
          - set_value:
              path: "outputs.traits.background"
              value: "{{ result.entry }}"
      - table: misfortunes
        actions:
          - set_value:
              path: "outputs.traits.misfortunes"
              value: "{{ result.entry }}"
      - table: alignment
        actions:
          - set_value:
              path: "outputs.traits.alignment"
              value: "{{ result.entry }}"
    actions:
      - display_message: "Physique: {{ outputs.traits.physique }}"
      - display_message: "Face: {{ outputs.traits.face }}"
      - display_message: "Skin: {{ outputs.traits.skin }}"
      - display_message: "Hair: {{ outputs.traits.hair }}"
      - display_message: "Clothing: {{ outputs.traits.clothing }}"
      - display_message: "Virtue: {{ outputs.traits.virtue }}"
      - display_message: "Vice: {{ outputs.traits.vice }}"
      - display_message: "Speech: {{ outputs.traits.speech }}"
      - display_message: "Background: {{ outputs.traits.background }}"
      - display_message: "Misfortunes: {{ outputs.traits.misfortunes }}"
      - display_message: "Alignment: {{ outputs.traits.alignment }}"
