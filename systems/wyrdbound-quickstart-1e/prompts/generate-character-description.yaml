id: generate_character_description
kind: prompt
name: "Character Description Generator"
description: "Generates a brief descriptive paragraph for a newly created Wyrdbound Quickstart character"
version: 1

llm:
  provider: ollama
  model: gemma2

prompt_template: |
  Please generate a paragraph description (~100 words) for a character for the tabletop role-playing game Wyrdbound Quickstart (1st Edition) who has the following traits:

  Name: {{ name }}
  Class: {{ character_class }}
  Physique: {{ traits.physique }}
  Virtue: {{ traits.virtue }}
  Vice: {{ traits.vice }}
  Speech: {{ traits.speech }}
  Background: {{ traits.background }}

  Please use the examples below as guidance. Keep the description grounded and character-focused — avoid specific world locations or invented lore. Use clear, evocative language that helps a player picture and roleplay the character.
  =============================
  EXAMPLE INPUT 1:
  Name: Maren Ashford
  Class: Warrior
  Physique: Rugged
  Virtue: Loyal
  Vice: Bitter
  Speech: Blunt
  Background: Mercenary

  EXAMPLE OUTPUT 1:
  Maren Ashford is built like someone who has taken a hundred hard knocks and kept walking — rugged, weathered, with the kind of posture that says she expects trouble and isn't afraid of it. A former mercenary, she's seen enough contracts go wrong to leave a permanent edge to her voice. She speaks in short, direct sentences with little patience for decoration. Loyal to those who earn it, she'd take a blade for a trusted companion without hesitation — but she carries old wounds that make trust slow to give. The bitterness is always there, just beneath the surface.

  =============================
  EXAMPLE INPUT 2:
  Name: Tobias Venn
  Class: Mage
  Physique: Scrawny
  Virtue: Curious
  Vice: Reckless
  Speech: Rambling
  Background: Scholar

  EXAMPLE OUTPUT 2:
  Tobias Venn is a lean, bespectacled figure who looks more at home in a library than on a road — which is, until recently, exactly where he was. A former scholar with a passion for arcane theory, his curiosity has a way of overriding his judgment. He launches into topics with enthusiasm and rarely finds a clean ending to any sentence. His recklessness isn't born of bravado but of forgetting to consider consequences mid-thought. When something catches his interest — a strange ruin, an unfamiliar spell diagram, an unexpected reaction — the rest of the world tends to disappear.
