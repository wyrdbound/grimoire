id: purchase_equipment
kind: flow
name: "Purchase Starting Equipment"
description: "Select starting weapons and armor using class-specific tables"
version: 2

inputs:
  - id: character_class
    type: str
  - id: current_gold
    type: int

outputs:
  - id: equipped_weapon
    type: str
    default: ""
  - id: equipped_armor
    type: str
    default: ""
  - id: remaining_gold
    type: int
    default: 0

variables:
  - id: weapon_cost
    type: int
    default: 0
  - id: armor_cost
    type: int
    default: 0

steps:
  - id: show_gold
    name: "Show Starting Gold"
    type: conditional_branch
    if: "{{ true }}"
    then:
      - display_message: "⚔️  Equipment Shop — You have {{ inputs.current_gold }} gp to spend."
    next_step: choose_weapon

  - id: choose_weapon
    name: "Choose Weapon"
    type: player_choice
    prompt: "Choose your weapon:"
    choice_source:
      table: "{{ inputs.character_class }}-weapons"
    actions:
      - set_value:
          path: "outputs.equipped_weapon"
          value: "{{ choice }}"
      - set_value:
          path: "variables.weapon_cost"
          value: "{{ choice_entry.cost_gp | int }}"
    next_step: choose_armor

  - id: choose_armor
    name: "Choose Armor"
    type: player_choice
    prompt: "Choose your armor:"
    choice_source:
      table: "{{ inputs.character_class }}-armor"
    actions:
      - set_value:
          path: "outputs.equipped_armor"
          value: "{{ choice }}"
      - set_value:
          path: "variables.armor_cost"
          value: "{{ choice_entry.cost_gp | int }}"
    next_step: finalize_gold

  - id: finalize_gold
    name: "Finalize Remaining Gold"
    type: conditional_branch
    if: "{{ true }}"
    then:
      - set_value:
          path: "outputs.remaining_gold"
          value: "{{ (inputs.current_gold | int) - variables.weapon_cost - variables.armor_cost }}"
      - display_message: "Remaining gold: {{ outputs.remaining_gold }} gp"
    next_step: done

  - id: done
    name: "Equipment Selected"
    type: completion
