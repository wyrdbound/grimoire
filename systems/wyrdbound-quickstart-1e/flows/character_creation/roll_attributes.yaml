id: roll_attributes
kind: flow
name: "Roll Attributes"
description: "Roll 4d6 keep highest 3 (reroll < 2) for each of the four attributes"
version: 1

outputs:
  - id: power
    type: int
  - id: agility
    type: int
  - id: mind
    type: int
  - id: charm
    type: int

steps:
  - id: roll_power
    name: "Roll Power"
    type: dice_roll
    roll: "4d6kh3r<2"
    actions:
      - set_value:
          path: "outputs.power"
          value: "{{ result.total }}"
      - display_message:
          text: "  Power:   {{ result.description }}"
    next_step: roll_agility

  - id: roll_agility
    name: "Roll Agility"
    type: dice_roll
    roll: "4d6kh3r<2"
    actions:
      - set_value:
          path: "outputs.agility"
          value: "{{ result.total }}"
      - display_message:
          text: "  Agility: {{ result.description }}"
    next_step: roll_mind

  - id: roll_mind
    name: "Roll Mind"
    type: dice_roll
    roll: "4d6kh3r<2"
    actions:
      - set_value:
          path: "outputs.mind"
          value: "{{ result.total }}"
      - display_message:
          text: "  Mind:    {{ result.description }}"
    next_step: roll_charm

  - id: roll_charm
    name: "Roll Charm"
    type: dice_roll
    roll: "4d6kh3r<2"
    actions:
      - set_value:
          path: "outputs.charm"
          value: "{{ result.total }}"
      - display_message:
          text: "  Charm:   {{ result.description }}"
    next_step: confirm_attributes

  - id: confirm_attributes
    name: "Confirm Attributes"
    type: player_choice
    prompt: "Keep these attributes?"
    choices:
      - id: keep
        label: "✅ Keep — looks good!"
        next_step: done
      - id: reroll
        label: "🎲 Reroll — try again"
        next_step: roll_power

  - id: done
    name: "Attributes Confirmed"
    type: completion
    actions:
      - display_message: "Attributes locked in."
