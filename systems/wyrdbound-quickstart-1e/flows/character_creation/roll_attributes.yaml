id: roll_attributes
kind: flow
name: "Roll Attributes"
description: "Roll 3d6 for each of the four attributes"
version: 1

outputs:
  - id: power
    type: int
  - id: agility
    type: int
  - id: mind
    type: int
  - id: charm
    type: int

steps:
  - id: roll_power
    name: "Roll Power"
    type: dice_roll
    roll: "3d6"
    actions:
      - set_value:
          path: "outputs.power"
          value: "{{ result.total }}"
    next_step: roll_agility

  - id: roll_agility
    name: "Roll Agility"
    type: dice_roll
    roll: "3d6"
    actions:
      - set_value:
          path: "outputs.agility"
          value: "{{ result.total }}"
    next_step: roll_mind

  - id: roll_mind
    name: "Roll Mind"
    type: dice_roll
    roll: "3d6"
    actions:
      - set_value:
          path: "outputs.mind"
          value: "{{ result.total }}"
    next_step: roll_charm

  - id: roll_charm
    name: "Roll Charm"
    type: dice_roll
    roll: "3d6"
    actions:
      - set_value:
          path: "outputs.charm"
          value: "{{ result.total }}"
    next_step: display_results

  - id: display_results
    name: "Display Attribute Rolls"
    type: completion
    actions:
      - display_message:
          text: "Attributes rolled:"
      - display_value:
          label: "Power"
          value: "{{ outputs.power }}"
      - display_value:
          label: "Agility"
          value: "{{ outputs.agility }}"
      - display_value:
          label: "Mind"
          value: "{{ outputs.mind }}"
      - display_value:
          label: "Charm"
          value: "{{ outputs.charm }}"
